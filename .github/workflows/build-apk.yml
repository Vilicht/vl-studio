name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Ekstrak ZIP proyek terbaru
        run: |
          ZIP_FILE=""
          if [ -f "vilicht-live-studio-build-ready.zip" ]; then
            ZIP_FILE="vilicht-live-studio-build-ready.zip"
          elif [ -f "vl-studio-fixed.zip" ]; then
            ZIP_FILE="vl-studio-fixed.zip"
          fi

          if [ -n "$ZIP_FILE" ]; then
            echo "Mengekstrak $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
            SUBDIR=$(find . -maxdepth 1 -type d ! -name "." ! -name ".git" ! -name ".github" ! -name "app" ! -name "gradle" | head -n 1)
            if [ -n "$SUBDIR" ] && [ -d "$SUBDIR/app" ]; then
              cp -rf "$SUBDIR"/* .
              rm -rf "$SUBDIR"
            fi
          fi

      - name: Auto-patch error kompilasi
        run: |
          python3 - << 'EOF'
          import pathlib

          ck = pathlib.Path("app/src/main/java/com/example/gl/ChromaKeyFilterRender.kt")
          if ck.exists():
              txt = ck.read_text()
              if "override fun disableResources()" not in txt:
                  txt = txt.replace("override fun release()", "override fun disableResources() {}\n\n    override fun release()")
                  ck.write_text(txt)

          ss = pathlib.Path("app/src/main/java/com/example/service/StreamingService.kt")
          if ss.exists():
              txt = ss.read_text()
              target = ".getMediaProjection(resultCode, data)"
              if target in txt and "?: throw IllegalStateException" not in txt:
                  txt = txt.replace(target, target + " ?: throw IllegalStateException(\"MediaProjection null\")")
                  ss.write_text(txt)

          ma = pathlib.Path("app/src/main/java/com/example/MainActivity.kt")
          if ma.exists():
              txt = ma.read_text()
              imp = "import androidx.compose.runtime.saveable.rememberSaveable"
              if "rememberSaveable" in txt and imp not in txt:
                  txt = txt.replace("package com.example\n", "package com.example\n\n" + imp + "\n", 1)
                  ma.write_text(txt)
          EOF

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK hasil build
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
