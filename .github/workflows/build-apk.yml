
name: VILICHT LIVE STUDIO - Auto Extract & Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Project ZIP
        run: |
          ZIP_FILE="vilicht-live-studio-audit-stage3.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: File $ZIP_FILE tidak ditemukan!"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          PROJECT_DIR="extracted/vl-studio-main"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Folder project Android tidak ditemukan!"
            find extracted -maxdepth 3 -type d
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Run Unit Tests
        working-directory: ${{ github.workspace }}/extracted/vl-studio-main
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        working-directory: ${{ github.workspace }}/extracted/vl-studio-main
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILICHT-LIVE-STUDIO-APK
          path: extracted/vl-studio-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
