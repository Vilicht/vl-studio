name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Ekstrak ZIP proyek terbaru
        run: |
          if [ -f "vilicht-live-studio-audit-stage3.zip" ]; then
            ZIP_FILE="vilicht-live-studio-audit-stage3.zip"
          else
            ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1)
          fi

          if [ -n "$ZIP_FILE" ]; then
            echo "Mengekstrak $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
            SUBDIR=$(find . -maxdepth 1 -type d ! -name "." ! -name ".git" ! -name ".github" ! -name "app" ! -name "gradle" | head -n 1)
            if [ -n "$SUBDIR" ] && [ -d "$SUBDIR/app" ]; then
              cp -rf "$SUBDIR"/* .
              rm -rf "$SUBDIR"
            fi
          fi

      - name: Auto-patch error kompilasi
        run: |
          python3 - << 'EOF'
          import pathlib

          def add_import(file_path, import_stmt):
              p = pathlib.Path(file_path)
              if not p.exists():
                  return
              txt = p.read_text()
              if import_stmt not in txt:
                  lines = txt.splitlines()
                  for i, line in enumerate(lines):
                      if line.strip().startswith("package "):
                          lines.insert(i + 1, import_stmt)
                          break
                  p.write_text("\n".join(lines) + "\n")

          # 1. Patch ChromaKeyFilterRender.kt
          ck = pathlib.Path("app/src/main/java/com/example/gl/ChromaKeyFilterRender.kt")
          if ck.exists():
              txt = ck.read_text()
              if "override fun disableResources()" not in txt:
                  txt = txt.replace("override fun release()", "override fun disableResources() {}\n\n    override fun release()")
                  ck.write_text(txt)

          # 2. Patch StreamingService.kt
          ss = pathlib.Path("app/src/main/java/com/example/service/StreamingService.kt")
          if ss.exists():
              txt = ss.read_text()
              target = ".getMediaProjection(resultCode, data)"
              if target in txt and "?: throw IllegalStateException" not in txt:
                  txt = txt.replace(target, target + " ?: throw IllegalStateException(\"MediaProjection null\")")
                  ss.write_text(txt)

          # 3. Patch MainActivity.kt
          ma = pathlib.Path("app/src/main/java/com/example/MainActivity.kt")
          if ma.exists() and "rememberSaveable" in ma.read_text():
              add_import("app/src/main/java/com/example/MainActivity.kt", "import androidx.compose.runtime.saveable.rememberSaveable")

          # 4. Patch trailing lambda QuickAction di PropertiesPanel.kt
          pp = pathlib.Path("app/src/main/java/com/example/ui/components/PropertiesPanel.kt")
          if pp.exists():
              txt = pp.read_text()
              bad = '"action_reset_rotation") { onSetRotation(0f) }'
              good = '"action_reset_rotation", { onSetRotation(0f) })'
              if bad in txt:
                  pp.write_text(txt.replace(bad, good))

          # 5. Patch missing LazyColumn items(List) import di LeftPanel.kt
          add_import("app/src/main/java/com/example/ui/components/LeftPanel.kt", "import androidx.compose.foundation.lazy.items")
          EOF

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK hasil build
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
