name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Ekstrak vl-studio-fixed.zip jika ada
        run: |
          if [ -f "vl-studio-fixed.zip" ]; then
            unzip -o vl-studio-fixed.zip
            SUBDIR=$(find . -maxdepth 1 -type d ! -name "." ! -name ".git" ! -name ".github" ! -name "app" ! -name "gradle" | head -n 1)
            if [ -n "$SUBDIR" ] && [ -d "$SUBDIR/app" ]; then
              cp -rf "$SUBDIR"/* .
              rm -rf "$SUBDIR"
            fi
          fi

      - name: Auto-patch error kompilasi bawaan AI Studio
        run: |
          python3 -c '
          import pathlib

          ck = pathlib.Path("app/src/main/java/com/example/gl/ChromaKeyFilterRender.kt")
          if ck.exists():
              txt = ck.read_text()
              if "override fun disableResources()" not in txt:
                  txt = txt.replace("override fun release()", "override fun disableResources() {}\n\n    override fun release()")
                  ck.write_text(txt)

          ss = pathlib.Path("app/src/main/java/com/example/service/StreamingService.kt")
          if ss.exists():
              txt = ss.read_text()
              target = ".getMediaProjection(resultCode, data)"
              if target in txt and "?: throw IllegalStateException" not in txt:
                  txt = txt.replace(target, target + " ?: throw IllegalStateException(\"MediaProjection null\")")
                  ss.write_text(txt)

          ma = pathlib.Path("app/src/main/java/com/example/MainActivity.kt")
          if ma.exists():
              txt = ma.read_text()
              imp = "import androidx.compose.runtime.saveable.rememberSaveable"
              if "rememberSaveable" in txt and imp not in txt:
                  txt = txt.replace("package com.example\n", "package com.example\n\n" + imp + "\n", 1)
                  ma.write_text(txt)
          '

      - name: Pasang Ikon Baru dari app_icon_master.png
        run: |
          if [ -f "app_icon_master.png" ]; then
            pip install pillow --quiet
            python3 - << 'EOF'
          import pathlib
          from PIL import Image

          img = Image.open("app_icon_master.png").convert("RGBA")
          w, h = img.size
          mx, my = int(w * 0.14), int(h * 0.14)
          cropped = img.crop((mx, my, w - mx, h - my))
          icon_512 = cropped.resize((512, 512), Image.Resampling.LANCZOS)

          res = pathlib.Path("app/src/main/res")
          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)

          # Hapus vector foreground lama agar tidak bentrok dengan PNG baru
          for old in ["ic_launcher_foreground.xml", "ic_launcher_background.xml"]:
              p = drawable / old
              if p.exists():
                  p.unlink()

          # Buat kanvas adaptive 432x432 dengan safe-zone padding agar tidak terpotong launcher
          fg = Image.new("RGBA", (432, 432), (19, 9, 31, 255))
          inner = icon_512.resize((300, 300), Image.Resampling.LANCZOS)
          fg.paste(inner, (66, 66), inner)
          fg.save(drawable / "ic_launcher_foreground.png", "PNG")

          # Simpan juga untuk logo in-app
          icon_512.save(drawable / "ic_vilicht_logo.png", "PNG")
          icon_512.convert("RGB").save(drawable / "vilicht_icon_1794323042231.jpg", "JPEG", quality=95)

          # Buat background solid valid
          (drawable / "ic_launcher_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<shape xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <solid android:color="#13091F" />\n'
              '</shape>\n'
          )

          # Timpa semua ukuran mipmap legacy
          sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          for folder, px in sizes.items():
              d = res / folder
              if d.exists():
                  r = icon_512.resize((px, px), Image.Resampling.LANCZOS)
                  r.save(d / "ic_launcher.png", "PNG")
                  r.save(d / "ic_launcher_round.png", "PNG")

          # Pastikan anydpi-v26 mengarah ke @drawable/ic_launcher_background & foreground
          anydpi = res / "mipmap-anydpi-v26"
          if anydpi.exists():
              xml_content = (
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <background android:drawable="@drawable/ic_launcher_background" />\n'
                  '    <foreground android:drawable="@drawable/ic_launcher_foreground" />\n'
                  '</adaptive-icon>\n'
              )
              (anydpi / "ic_launcher.xml").write_text(xml_content)
              (anydpi / "ic_launcher_round.xml").write_text(xml_content)
          EOF
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK hasil build
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
