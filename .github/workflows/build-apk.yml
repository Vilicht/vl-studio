
name: VILICHT LIVE STUDIO - Auto Extract & Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Project ZIP
        run: |
          ZIP_FILE="vilicht-live-studio-audit-stage3.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP tidak ditemukan!"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          PROJECT_DIR="extracted/vl-studio-main"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Struktur project tidak ditemukan!"
            find extracted -maxdepth 3 -type d
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Restore Debug Keystore
        uses: actions/cache@v4
        with:
          path: extracted/vl-studio-main/debug.keystore
          key: vilicht-live-studio-debug-keystore-v1

      - name: Generate Debug Keystore If Missing
        working-directory: extracted/vl-studio-main
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating debug keystore..."

            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Existing debug keystore restored."
          fi

      - name: Run Unit Tests
        working-directory: extracted/vl-studio-main
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        working-directory: extracted/vl-studio-main
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILICHT-LIVE-STUDIO-APK
          path: extracted/vl-studio-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
