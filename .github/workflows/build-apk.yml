name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Ekstrak vl-studio-fixed.zip jika ada
        run: |
          if [ -f "vl-studio-fixed.zip" ]; then
            unzip -o vl-studio-fixed.zip
            SUBDIR=$(find . -maxdepth 1 -type d ! -name "." ! -name ".git" ! -name ".github" ! -name "app" ! -name "gradle" | head -n 1)
            if [ -n "$SUBDIR" ] && [ -d "$SUBDIR/app" ]; then
              cp -rf "$SUBDIR"/* .
              rm -rf "$SUBDIR"
            fi
          fi

      - name: Auto-patch error kompilasi & Pasang Ikon Baru
        run: |
          pip install pillow --quiet
          python3 -c '
          import pathlib, textwrap
          from PIL import Image

          # 1. Patch ChromaKeyFilterRender.kt
          ck = pathlib.Path("app/src/main/java/com/example/gl/ChromaKeyFilterRender.kt")
          if ck.exists():
              txt = ck.read_text()
              if "override fun disableResources()" not in txt:
                  txt = txt.replace("override fun release()", "override fun disableResources() {}\n\n    override fun release()")
                  ck.write_text(txt)

          # 2. Patch StreamingService.kt
          ss = pathlib.Path("app/src/main/java/com/example/service/StreamingService.kt")
          if ss.exists():
              txt = ss.read_text()
              target = ".getMediaProjection(resultCode, data)"
              if target in txt and "?: throw IllegalStateException" not in txt:
                  txt = txt.replace(target, target + " ?: throw IllegalStateException(\"MediaProjection null\")")
                  ss.write_text(txt)

          # 3. Patch MainActivity.kt
          ma = pathlib.Path("app/src/main/java/com/example/MainActivity.kt")
          if ma.exists():
              txt = ma.read_text()
              imp = "import androidx.compose.runtime.saveable.rememberSaveable"
              if "rememberSaveable" in txt and imp not in txt:
                  txt = txt.replace("package com.example\n", "package com.example\n\n" + imp + "\n", 1)
                  ma.write_text(txt)

          # 4. Proses & Pasang app_icon_master.png jika tersedia
          master = pathlib.Path("app_icon_master.png")
          if master.exists():
              img = Image.open(master).convert("RGBA")
              w, h = img.size
              margin_x = int(w * 0.14)
              margin_y = int(h * 0.14)
              cropped = img.crop((margin_x, margin_y, w - margin_x, h - margin_y))
              icon_512 = cropped.resize((512, 512), Image.Resampling.LANCZOS)

              res_dir = pathlib.Path("app/src/main/res")
              icon_512.save(res_dir / "drawable/ic_vilicht_logo.png", "PNG")
              icon_512.convert("RGB").save(res_dir / "drawable/vilicht_icon_1794323042231.jpg", "JPEG", quality=95)

              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192,
              }
              for folder, px in sizes.items():
                  d = res_dir / folder
                  if d.exists():
                      resized = icon_512.resize((px, px), Image.Resampling.LANCZOS)
                      resized.save(d / "ic_launcher.png", "PNG")
                      resized.save(d / "ic_launcher_round.png", "PNG")

              # Pastikan warna ic_launcher_background tersedia di values/colors.xml
              values_dir = res_dir / "values"
              values_dir.mkdir(parents=True, exist_ok=True)
              (values_dir / "ic_launcher_background.xml").write_text(textwrap.dedent("""\
                  <?xml version="1.0" encoding="utf-8"?>
                  <resources>
                      <color name="ic_launcher_background">#13091F</color>
                  </resources>
              """))

              # Update adaptive icon XML
              adaptive_dir = res_dir / "mipmap-anydpi-v26"
              if adaptive_dir.exists():
                  adaptive_xml = textwrap.dedent("""\
                      <?xml version="1.0" encoding="utf-8"?>
                      <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                          <background android:drawable="@color/ic_launcher_background"/>
                          <foreground>
                              <inset android:drawable="@drawable/ic_vilicht_logo" android:inset="16%" />
                          </foreground>
                      </adaptive-icon>
                  """)
                  (adaptive_dir / "ic_launcher.xml").write_text(adaptive_xml)
                  (adaptive_dir / "ic_launcher_round.xml").write_text(adaptive_xml)
          '

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK hasil build
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
