name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIP_BASE: vilicht-live-studio-audit-stage3
  GRADLE_VERSION: '9.3.1'
  GRADLE_ARGS: --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Siapkan project (prioritaskan ZIP baru)
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=""
          CAND=""

          for f in "$ZIP_BASE.zip" "$ZIP_BASE"; do
            if [ -f "$f" ] && unzip -tqq "$f" >/dev/null 2>&1; then CAND="$f"; break; fi
          done

          if [ -z "$CAND" ]; then
            while IFS= read -r f; do
              if unzip -tqq "$f" >/dev/null 2>&1; then CAND="$f"; break; fi
            done < <(find . -maxdepth 2 -type f \( -iname '*vilicht*' -o -iname '*.zip' \) \
                       -not -path './.git/*' -not -path './extracted/*' | sort)
          fi

          if [ -n "$CAND" ]; then
            echo "Mengekstrak ZIP terbaru: $CAND"
            rm -rf extracted && mkdir extracted
            unzip -q -o "$CAND" -d extracted
            SETTINGS="$(find extracted -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) \
                          -not -path '*/__MACOSX/*' | sort | head -n 1)"
            if [ -z "$SETTINGS" ]; then
              echo "::error::settings.gradle(.kts) tidak ditemukan di dalam ZIP."
              exit 1
            fi
            BUILD_DIR="$(cd "$(dirname "$SETTINGS")" && pwd)"
          elif [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            BUILD_DIR="$PWD"
            echo "Tidak ada ZIP, memakai folder root repo."
          else
            echo "::error::Tidak ada ZIP maupun folder project ditemukan."
            exit 1
          fi

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "Project aktif di: $BUILD_DIR"
          [ -d "$BUILD_DIR/app" ] || { echo "::error::Folder app/ tidak ada."; exit 1; }

      - name: Auto-patch error kompilasi Kotlin
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          python3 - << 'EOF'
          import pathlib, re

          def add_import(file_path, import_stmt):
              p = pathlib.Path(file_path)
              if not p.exists():
                  return
              txt = p.read_text()
              if import_stmt not in txt:
                  lines = txt.splitlines()
                  for i, line in enumerate(lines):
                      if line.strip().startswith("package "):
                          lines.insert(i + 1, import_stmt)
                          break
                  p.write_text("\n".join(lines) + "\n")

          # 1. Patch ChromaKeyFilterRender.kt
          ck = pathlib.Path("app/src/main/java/com/example/gl/ChromaKeyFilterRender.kt")
          if ck.exists():
              txt = ck.read_text()
              if "override fun disableResources()" not in txt:
                  txt = txt.replace("override fun release()", "override fun disableResources() {}\n\n    override fun release()")
                  ck.write_text(txt)

          # 2. Patch StreamingService.kt
          ss = pathlib.Path("app/src/main/java/com/example/service/StreamingService.kt")
          if ss.exists():
              txt = ss.read_text()
              target = ".getMediaProjection(resultCode, data)"
              if target in txt and "?: throw IllegalStateException" not in txt:
                  txt = txt.replace(target, target + " ?: throw IllegalStateException(\"MediaProjection null\")")
                  ss.write_text(txt)

          # 3. Patch MainActivity.kt
          ma = pathlib.Path("app/src/main/java/com/example/MainActivity.kt")
          if ma.exists() and "rememberSaveable" in ma.read_text():
              add_import("app/src/main/java/com/example/MainActivity.kt", "import androidx.compose.runtime.saveable.rememberSaveable")

          # 4. Patch semua trailing lambda di PropertiesPanel.kt
          pp = pathlib.Path("app/src/main/java/com/example/ui/components/PropertiesPanel.kt")
          if pp.exists():
              txt = pp.read_text()
              bad = '"action_reset_rotation") { onSetRotation(0f) }'
              good = '"action_reset_rotation", { onSetRotation(0f) })'
              if bad in txt:
                  txt = txt.replace(bad, good)
              lines = txt.splitlines()
              for idx in range(len(lines)):
                  if ") {" in lines[idx] and "onChange" not in lines[idx] and "onClick" not in lines[idx]:
                      block = "\n".join(lines[idx:min(idx + 4, len(lines))])
                      if "it" in block:
                          lines[idx] = lines[idx].replace(") {", ", onChange = {")
                          for j in range(idx, min(idx + 4, len(lines))):
                              if lines[j].rstrip().endswith("}"):
                                  lines[j] = lines[j].rstrip() + ")"
                                  break
              pp.write_text("\n".join(lines) + "\n")

          # 5. Patch universal untuk items(...) di LeftPanel.kt
          lp = pathlib.Path("app/src/main/java/com/example/ui/components/LeftPanel.kt")
          if lp.exists():
              add_import("app/src/main/java/com/example/ui/components/LeftPanel.kt", "import androidx.compose.foundation.lazy.items")
              txt = lp.read_text()
              txt = re.sub(r'\bitems\(\s*([a-zA-Z0-9_.]+)\s*,\s*\{', r'items(items = \1, key = {', txt)
              lp.write_text(txt)
          EOF

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Siapkan debug keystore dan file pendukung
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi

      - name: Unit test
        id: unit
        continue-on-error: true
        working-directory: ${{ env.BUILD_DIR }}
        run: gradle testDebugUnitTest $GRADLE_ARGS

      - name: Build Debug APK
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          gradle assembleDebug --no-daemon --console=plain -Dorg.gradle.jvmargs=-Xmx4g > build.log 2>&1 || (
            echo "=== DAFTAR ERROR KOTLIN ==="
            grep -E "^e: |Unresolved|mismatch|No value passed|Overload" build.log || tail -n 60 build.log
            exit 1
          )

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vilicht-live-studio-debug
          path: ${{ env.BUILD_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload laporan test dan build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            ${{ env.BUILD_DIR }}/app/build/reports/
            ${{ env.BUILD_DIR }}/app/build/test-results/
          if-no-files-found: ignore

      - name: Status akhir (job gagal bila unit test gagal)
        if: steps.unit.outcome == 'failure'
        run: |
          echo "::error::APK debug berhasil dibuat, tetapi unit test GAGAL. Lihat artifact 'build-reports'."
          exit 1
